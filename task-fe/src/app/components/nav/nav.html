<nav
  class="navbar navbar-expand-lg border-secondary sticky-top  px-5 z-6"
>
  <div class="w-100 d-flex justify-content-between">
    <!-- Brand -->
    @if (isLoggedIn) {
      <div class="d-flex justify-content-between align-items-start w-100">
        <div class="w-75 text-center">
          <div class="positione-relative">
            <p
              class="fs-2 d-flex justify-content-end gap-2 align-items-center position-absolute menu-title"
              [ngClass]="isDark ? 'text-danger' : 'text-success'"
            >
              Succeed
              <i
                class="pi toggle-i fs-4"
                (click)="toggleMenu()"
                [ngClass]="showMenu ? 'pi-chevron-up' : 'pi-chevron-down'"
              ></i>
            </p>
              <div
                [ngClass]="
                  showMenu
                    ? 'menu'
                    : 'menu-hidden'
                "
                class="position-absolute text-start rounded p-3 bg-white border shadow"
              >
                @for (v of menuVoices; track v.id) {
                  <p
                    class="fs-3 d-flex align-items-end gap-2"
                    [ngStyle]="user && v.value == 'people' ? { display: 'none' } : {}"
                    [ngStyle]="v.value == 'Leave'?{'color':'red'}:{}"
                  >
                    <i class="fs-5 pi {{ v.icon }}" ></i> {{ v.value }}
                  </p>
                }
              </div>
          </div>
        </div>
        <div class="w-25 position-relative mode-container text-end">
          <button class="btn" type="button" (click)="toggleMode()">
            @if (isDark) {
              <i class="pi pi-sun fs-3 text-danger" pTooltip="Light mode"></i>
            } @else {
              <i class="pi pi-moon fs-3 text-success" pTooltip="Dark mode"></i>
            }
          </button>
        </div>
      </div>
    }
  </div>
</nav>
<p-toast />
