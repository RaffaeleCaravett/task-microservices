@if (authService.getIsLoggedIn()) {
  <footer class="border-top mt-auto" [ngClass]="isDark ? 'dark-footer' : 'light-footer'">
    <div class="container py-5">
      <div class="row">
        <!-- Brand -->
        <div class="col-lg-4 mb-4">
          <h5 class="fw-bold">TaskMaster</h5>
          <p>Organizza il tuo lavoro, senza stress.</p>
        </div>

        <!-- Prodotto -->
        <div class="col-lg-2 col-md-3 mb-4">
          <h6 class="text-uppercase fw-bold mb-3 fs-5">Prodotto</h6>
          <ul class="list-unstyled">
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5">Funzionalità</button></a
              >
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Prezzi</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Roadmap</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5">Aggiornamenti</button></a
              >
            </li>
          </ul>
        </div>

        <!-- Risorse -->
        <div class="col-lg-2 col-md-3 mb-4">
          <h6 class="text-uppercase fw-bold mb-3 fs-5">Risorse</h6>
          <ul class="list-unstyled">
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5 text-start">Centro assistenza</button></a
              >
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Guide</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Blog</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5">Changelog</button></a
              >
            </li>
          </ul>
        </div>

        <!-- Azienda -->
        <div class="col-lg-2 col-md-3 mb-4">
          <h6 class="text-uppercase fw-bold mb-3 fs-5">Azienda</h6>
          <ul class="list-unstyled">
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5 text-start">Chi siamo</button></a
              >
            </li>
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5 text-start">Lavora con noi</button></a
              >
            </li>
            <li>
              <a href="#" class="text-decoration-none"
                ><button class="btn fs-5">Contatti</button></a
              >
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Press</button></a>
            </li>
          </ul>
        </div>

        <!-- Legale -->
        <div class="col-lg-2 col-md-3 mb-4">
          <h6 class="text-uppercase fw-bold mb-3 fs-5">Legale</h6>
          <ul class="list-unstyled">
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Termini</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Privacy</button></a>
            </li>
            <li>
              <a href="#" class="text-decoration-none"><button class="btn fs-5">Cookie</button></a>
            </li>
          </ul>
        </div>
      </div>

      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-4 border-top border-secondary"
      >
        <small [ngClass]="isDark ? 'text-danger' : 'text-success'">
          © 2025 TaskApp. Tutti i diritti riservati.
        </small>

        <div class="mt-3 mt-md-0">
          <a href="#" class="me-3 text-decoration-none"
            ><button class="btn fs-5">Twitter</button></a
          >
          <a href="#" class="me-3 text-decoration-none"
            ><button class="btn fs-5">LinkedIn</button></a
          >
          <a href="#" class="text-decoration-none"><button class="btn fs-5">GitHub</button></a>
        </div>
      </div>
    </div>
  </footer>
}
