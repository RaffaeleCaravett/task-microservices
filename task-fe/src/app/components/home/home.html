<div
  class="row text-center py-5 home"
  [ngClass]="isDark ? ['dark-home','text-black'] : 'light-home'"
>
  <div class="col-12 p-5 d-flex align-items-center">
    <h1 class="title m-auto text-uppercase">Get things done</h1>
  </div>
  <div class="col-md-12">
   <div class="d-flex gap-4 justify-content-center">
    <button class="btn btn-lg" [ngClass]="isDark?['dark-btn-login',]:'light-btn-login'">
      Login
    </button>
    <button class="btn btn-lg" [ngClass]="isDark?'dark-btn-signup':'light-btn-signup'">
      Signup
    </button>
   </div>
  </div>
</div>
